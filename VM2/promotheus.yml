global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["192.168.44.10:9093"]

rule_files:
  - "alert_rules.yml"

# Prometheus:
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["192.168.44.10:9090"]

  # Node Exporter:
  - job_name: "node_exporter"
    static_configs:
      - targets: ["192.168.25.10:9100"]

  # Blackbox Exporter:
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus.io
          - https://prometheus.io
          - http://192.168.44.10:8080/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.44.10:9115
